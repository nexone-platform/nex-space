services:
  nexspace-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: nexspace-web
    restart: always
    ports:
      - "8087:80"
    depends_on:
      - nexspace-game
      - nexspace-api

  nexspace-game:
    build:
      context: .
      dockerfile: apps/game-server/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: nexspace-game
    depends_on:
      - nexspace-api
    restart: always
    environment:
      - PORT=2567
      # used to check workspace membership before admitting a client to a room
      - API_URL=http://nexspace-api:3001
      - LIVEKIT_URL=${LIVEKIT_URL:-}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-}
    ports:
      - "2567:2567"

  nexspace-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: nexspace-api
    restart: always
    environment:
      - PORT=3001
      # Absolute path into the data volume. It must NOT sit inside apps/api/prisma:
      # mounting a volume there hides the image's schema.prisma behind the copy
      # Docker seeded on the first deploy, so `prisma db push` and `prisma
      # generate` keep reading a stale schema and the client never learns about
      # new columns. The volume now mounts at ./data instead, and the database
      # keeps the prisma/prod.db path it already had inside that volume.
      - DATABASE_URL=file:/app/apps/api/data/prisma/prod.db
      # Google sign-in (optional — the button hides itself when unset).
      # Authorised redirect URI in Google Cloud: https://<your-host>/auth/google/callback
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      # Both are derived from the forwarded host by default. Set them only if the
      # app sits behind extra proxies and the derived URLs come out wrong.
      - APP_URL=${APP_URL:-}
      - OAUTH_REDIRECT_URL=${OAUTH_REDIRECT_URL:-}
      # name shown inside the user's authenticator app (2FA needs nothing else)
      - TOTP_ISSUER=${TOTP_ISSUER:-NexSpace}
      # SMTP for the 6-digit sign-in code (optional — codes are logged when unset)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
    ports:
      - "3001:3001"
    volumes:
      # same volume as before, mounted somewhere that shadows nothing in the image
      - nexspace-api-data:/app/apps/api/data

volumes:
  nexspace-api-data:
