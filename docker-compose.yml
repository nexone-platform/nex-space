services:
  nexspace-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: nexspace-web
    restart: always
    ports:
      - "8087:80"
    depends_on:
      - nexspace-game
      - nexspace-api

  nexspace-game:
    build:
      context: .
      dockerfile: apps/game-server/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: nexspace-game
    depends_on:
      - nexspace-api
    restart: always
    environment:
      - PORT=2567
      # used to check workspace membership before admitting a client to a room
      - API_URL=http://nexspace-api:3001
      - LIVEKIT_URL=${LIVEKIT_URL:-}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-}
    ports:
      - "2567:2567"

  nexspace-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: nexspace-api
    restart: always
    environment:
      - PORT=3001
      # Absolute path into the data volume. It must NOT sit inside apps/api/prisma:
      # mounting a volume there hides the image's schema.prisma behind the copy
      # Docker seeded on the first deploy, so `prisma db push` and `prisma
      # generate` keep reading a stale schema and the client never learns about
      # new columns. The volume now mounts at ./data instead, and the database
      # keeps the prisma/prod.db path it already had inside that volume.
      - DATABASE_URL=file:/app/apps/api/data/prisma/prod.db
      # Google sign-in (optional — the button hides itself when unset).
      # Authorised redirect URI in Google Cloud: https://<your-host>/auth/google/callback
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      # Both are derived from the forwarded host by default. Set them only if the
      # app sits behind extra proxies and the derived URLs come out wrong.
      - APP_URL=${APP_URL:-}
      - OAUTH_REDIRECT_URL=${OAUTH_REDIRECT_URL:-}
      # name shown inside the user's authenticator app (2FA needs nothing else)
      - TOTP_ISSUER=${TOTP_ISSUER:-NexSpace}
      # SMTP for the 6-digit sign-in code (optional — codes are logged when unset)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      # Relay for calls that cannot find a direct path (the coturn service
      # below). Blank means STUN only: fine at home, silence behind a corporate
      # firewall. TURN_HOST must be the public name or address of THIS machine —
      # browsers reach the relay directly, not through nginx.
      - TURN_SECRET=${TURN_SECRET:-}
      - TURN_HOST=${TURN_HOST:-}
      - TURN_PORT=${TURN_PORT:-3478}
      - TURN_TLS_PORT=${TURN_TLS_PORT:-0}
      - TURN_TTL=${TURN_TTL:-43200}
      - STUN_URL=${STUN_URL:-}
    ports:
      - "3001:3001"
    volumes:
      # same volume as before, mounted somewhere that shadows nothing in the image
      - nexspace-api-data:/app/apps/api/data

  # The relay itself. It only runs when the profile is switched on, so a
  # deployment without a TURN_SECRET is not left with a container that cannot
  # start:  docker compose --profile turn up -d
  nexspace-turn:
    image: coturn/coturn:4.6-alpine
    container_name: nexspace-turn
    restart: always
    profiles: ["turn"]
    # Host networking, not a port map. A relay hands out a different UDP port per
    # call and tells the browser its own address; behind docker's NAT it would
    # advertise an address from the bridge network that nobody outside can reach,
    # and every allocation would need publishing by hand.
    network_mode: host
    command:
      - -n                                   # no config file, everything is here
      - --log-file=stdout
      - --realm=${TURN_REALM:-nexspace}
      - --listening-port=${TURN_PORT:-3478}
      # The secret is never sent to a browser. The API signs a short-lived
      # username with it and coturn recomputes the same signature to check it,
      # so there are no accounts and nothing to leak but time-limited passwords.
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?set TURN_SECRET in .env before starting the relay}
      # One port per live relay. Open this range on the firewall or nothing gets
      # through — the mistake that looks exactly like TURN not working at all.
      - --min-port=${TURN_MIN_PORT:-49160}
      - --max-port=${TURN_MAX_PORT:-49260}
      # A relay forwards packets wherever it is told to, so it must be told where
      # it may not: without this, anyone holding a credential could use it to
      # reach the database, the API, and everything else on this machine and its
      # private network. This is the most important block here.
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=::1
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      # caps, so one abused credential cannot take the machine's whole uplink
      - --user-quota=12
      - --total-quota=200
      - --no-cli                             # no admin telnet on a host-networked box
      - --no-tlsv1
      - --no-tlsv1_1
      - --fingerprint

volumes:
  nexspace-api-data:
