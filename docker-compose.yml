version: '3.8'

services:
  nexspace-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: nexspace-web
    restart: always
    ports:
      - "8087:80"
    depends_on:
      - nexspace-game
      - nexspace-api

  nexspace-game:
    build:
      context: .
      dockerfile: apps/game-server/Dockerfile
    container_name: nexspace-game
    depends_on:
      - nexspace-api
    restart: always
    environment:
      - PORT=2567
      # used to check workspace membership before admitting a client to a room
      - API_URL=http://nexspace-api:3001
      - LIVEKIT_URL=${LIVEKIT_URL:-}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-}
    ports:
      - "2567:2567"

  nexspace-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nexspace-api
    restart: always
    environment:
      - PORT=3001
      # db lives inside the mounted prisma dir so it persists on the named volume
      - DATABASE_URL=file:./prisma/prod.db
      # Google sign-in (optional — the button hides itself when unset).
      # Authorised redirect URI in Google Cloud: https://<your-host>/auth/google/callback
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      # Both are derived from the forwarded host by default. Set them only if the
      # app sits behind extra proxies and the derived URLs come out wrong.
      - APP_URL=${APP_URL:-}
      - OAUTH_REDIRECT_URL=${OAUTH_REDIRECT_URL:-}
      # SMTP for the 6-digit sign-in code (optional — codes are logged when unset)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
    ports:
      - "3001:3001"
    volumes:
      - nexspace-api-data:/app/apps/api/prisma

volumes:
  nexspace-api-data:
