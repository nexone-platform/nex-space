<meta charset="utf-8">
<title>booking a room probe</title>
<!--
  Booking a room from the week grid, driven through the real panel and the real
  week view — the two together, because the bug this file was written for lives
  in the seam between them and neither one can show it alone.

  Open http://localhost:5173/calbook-probe.html with the web dev server running.

  The markup and the stylesheet are pulled out of index.html when the probe
  runs rather than copied beside it. fetch is replaced: the POST answers the
  way the API answers, including its refusals.

  What is checked: that an hour nobody can book is not offered, and that when
  the server does refuse, the person who filled in the form can read why.
-->
<div id="stage"></div>
<pre id="out" style="font:13px/1.6 ui-monospace,monospace;padding:16px;white-space:pre-wrap;position:relative;z-index:99"></pre>
<script type="module">
// ---- the real page, as it actually is ---------------------------------------
const page = new DOMParser().parseFromString(await (await fetch("/index.html")).text(), "text/html");
for (const s of page.querySelectorAll("style")) document.head.appendChild(s.cloneNode(true));
document.getElementById("stage").appendChild(document.importNode(page.getElementById("cal-view"), true));
// The panel lives in a sidebar tab in the app. Here it gets the same id and the
// same place in the stacking order: behind the week view, which is fixed and
// covers the screen.
const side = document.createElement("div");
side.id = "view-cal";
side.style.cssText = "position:fixed;left:0;top:0;width:320px;height:100%;overflow:auto";
document.body.appendChild(side);

const { mountCalendarPanel, freshBookings } = await import("/src/calendarPanel.ts");
const { mountCalendarWeek } = await import("/src/calendarView.ts");

const out = document.getElementById("out");
const log = (s) => { out.textContent += s + "\n"; };
let pass = 0, fail = 0;
const ok = (n, c, x = "") => { c ? pass++ : fail++; log(`${c ? "  PASS" : "! FAIL"}  ${n}${x ? "  " + x : ""}`); };
const tick = () => new Promise((r) => setTimeout(r, 20));

// ---- an API that refuses the way the API refuses -----------------------------
// These are the sentences apps/api/src/calendar.ts actually returns. They are
// English on the wire, which is the second half of this bug: they were being
// shown to the person as they arrived.
const posts = [];
let refuseWith = null;   // { why, error } — the shape the API answers with
globalThis.fetch = async (url, init = {}) => {
  const u = String(url);
  if ((init.method ?? "GET") === "GET") {
    return { ok: true, status: 200, json: async () => ({ bookings: [] }) };
  }
  posts.push(JSON.parse(init.body));
  if (refuseWith) {
    return { ok: false, status: 400, json: async () => refuseWith };
  }
  return { ok: true, status: 200, json: async () => ({ booking: { id: "b1" } }) };
};

// The role arrives from a fetch the scene starts after mounting the panel, so
// at mount every account still looks like a guest. Modelled exactly: false
// first, true a moment later.
let role = "guest";
const panel = mountCalendarPanel({
  host: side, api: "http://x", workspace: "test", token: "t", mapSlug: "main",
  rooms: () => [{ id: "lounge", label: "โซนพักผ่อน" }, { id: "big", label: "ห้องประชุมใหญ่" }],
  canBook: () => role !== "guest", canManage: () => true,
});
const week = mountCalendarWeek({
  bookings: () => panel.bookings(),
  rooms: () => [{ id: "lounge", label: "โซนพักผ่อน" }, { id: "big", label: "ห้องประชุมใหญ่" }],
  form: panel.form,
  note: panel.note,
  compose: (at, roomId) => panel.compose(at, roomId),
  foot: panel.foot ?? document.createElement("div"),
  canBook: () => true, canManage: () => true,
  cancel: (id) => panel.cancel(id),
  going: (id, coming) => panel.going(id, coming),
  onOpen: () => void panel.refresh(),
});

week.open();
await tick();

const grid = document.getElementById("cw-grid");
const modal = document.getElementById("cw-modal");
const cells = () => [...grid.querySelectorAll(".cw-hour")];
const startIn = () => panel.form.querySelector('input[type="datetime-local"]');
const ends = () => panel.form.querySelectorAll('input[type="datetime-local"]')[1];
const titleIn = () => panel.form.querySelector('input[type="text"]');
const submit = () => panel.form.querySelector("button.cal-save");

log("\nbooking a room from the week grid\n");

// ---- an hour that cannot be booked --------------------------------------------
// The week always opens on the week containing today, so on any day but Sunday
// there are hours on screen that have already happened. Clicking one filled the
// form in with them, and the only thing that ever said no was the server.
const FIRST_HOUR = 7, DAYS = 7;
const now = new Date();
const past = cells().filter((c) => !c.classList.contains("cw-gutter")).findIndex((c, i) => {
  const day = i % DAYS, hour = FIRST_HOUR + Math.floor(i / DAYS);
  const at = new Date(now); at.setHours(0, 0, 0, 0);
  at.setDate(at.getDate() - at.getDay() + day); at.setHours(hour, 0, 0, 0);
  return +at < Date.now() - 6 * 60 * 60 * 1000;   // safely past, not the current hour
});
const hours = cells().filter((c) => !c.classList.contains("cw-gutter"));
if (past < 0) {
  log("  skip  no hour on screen is in the past (the week opened on a Sunday morning)");
} else {
  const cell = hours[past];
  ok("an hour that has already gone is not offered as free",
    !cell.classList.contains("free"), cell.className);
  /**
   * And looks different from one that is.
   *
   * The first version of this marked past hours var(--surface-3), which is the
   * colour the view behind them already was: a class that did nothing visible.
   * A cell paints nothing of its own when it is free, so what has to differ is
   * the gone cell against whatever shows through a free one.
   */
  const free = hours.find((c) => c.classList.contains("free"));
  const behind = (el) => {
    for (let n = el; n; n = n.parentElement) {
      const c = getComputedStyle(n).backgroundColor;
      if (c && !/rgba\(0, 0, 0, 0\)|transparent/.test(c)) return c;
    }
    return "none";
  };
  ok("  · and is a different colour from one that is free",
    behind(cell) !== behind(free), `${behind(cell)} vs ${behind(free)}`);
  cell.click();
  await tick();
  ok("  · and clicking it does not open a form pointed at the past",
    modal.hidden || +new Date(startIn().value) > Date.now() - 6 * 60 * 60 * 1000,
    modal.hidden ? "(no form opened)" : startIn().value);
  if (!modal.hidden) document.getElementById("cw-modal").click();
  await tick();
}

// ---- when the server does refuse --------------------------------------------
// It still can: two people can fill the same form at the same minute, and the
// grace period is only five minutes wide. What must not happen is a 400 that
// the person who pressed the button cannot see.
const future = hours.findIndex((c, i) => {
  const day = i % DAYS, hour = FIRST_HOUR + Math.floor(i / DAYS);
  const at = new Date(now); at.setHours(0, 0, 0, 0);
  at.setDate(at.getDate() - at.getDay() + day); at.setHours(hour, 0, 0, 0);
  return +at > Date.now() + 24 * 60 * 60 * 1000;
});
hours[future].click();
await tick();
ok("a free hour ahead opens the form on that hour", !modal.hidden && !!startIn().value, startIn()?.value);

titleIn().value = "ทดสอบ";
refuseWith = { why: "past", error: "that time has already passed" };
submit().click();
await tick(); await tick();

ok("the booking was actually attempted", posts.length === 1, JSON.stringify(posts[0] ?? null).slice(0, 120));

// The message element is the panel's own, and the panel is behind the week view.
const msg = side.querySelector(".cal-msg") ?? document.querySelector(".cal-msg");
const wrote = (msg?.textContent ?? "").trim();
ok("a refusal is said somewhere at all", wrote.length > 0, JSON.stringify(wrote));
ok("  · where the form the person filled in actually is",
  !!document.getElementById("cw-sheet").contains(msg) || (() => {
    // covered counts as not said: the week view is fixed and over the sidebar
    const b = msg.getBoundingClientRect();
    if (!b.width || !b.height) return false;
    const on = document.elementFromPoint(b.left + b.width / 2, b.top + b.height / 2);
    return msg.contains(on) || msg === on;
  })(),
  "the panel sits behind a fixed, full-screen week view");
ok("  · in the reader's language, not the wire's",
  wrote.length > 0 && !/[a-z]{4}/.test(wrote), JSON.stringify(wrote));
ok("  · and the form is still there to correct, not closed",
  !modal.hidden && !panel.form.hidden);

// A refusal this build has never heard of — an older or newer server — must
// still say something rather than nothing.
refuseWith = { why: "something-invented-later", error: "no bookings on Tuesdays" };
submit().click();
await tick(); await tick();
ok("  · a reason with no translation is passed through, not swallowed",
  (side.querySelector(".cal-msg") ?? document.querySelector(".cal-msg")).textContent.includes("Tuesdays"),
  document.querySelector(".cal-msg").textContent);

// And the numbers in a refusal come from the server, because they are settings.
refuseWith = { why: "too-long", error: "a booking is at most 8 hours", n: 8 };
submit().click();
await tick(); await tick();
ok("  · and a limit is quoted as the server's number, not a hard-coded one",
  document.querySelector(".cal-msg").textContent.includes("8"),
  document.querySelector(".cal-msg").textContent);

// ---- and when it works ------------------------------------------------------
refuseWith = null;
posts.length = 0;
submit().click();
await tick(); await tick();
ok("a booking the server accepts closes the form", panel.form.hidden || modal.hidden);
ok("  · and was sent as UTC, whatever the reader's clock says",
  /Z$/.test(posts[0]?.startsAt ?? ""), posts[0]?.startsAt);

// ---- being told that somebody else booked a room ----------------------------
// Until this, a booking told nobody but the person who made it: the invitation
// goes to whoever said they are coming, and at the moment a room is booked that
// is the host alone. Everybody else found out by walking past the door.
log("");
{
  const soon = new Date(Date.now() + 2 * 3600e3).toISOString();
  const ended = new Date(Date.now() - 3600e3).toISOString();
  const row = (id, mine, endsAt = new Date(Date.now() + 3 * 3600e3).toISOString()) =>
    ({ id, mine, startsAt: soon, endsAt, title: "t", room: "r", host: "h" });

  const first = freshBookings(undefined, [row("a", false), row("b", false)]);
  ok("joining a space announces nothing", first.fresh.length === 0,
    "forty meetings already in the calendar are not forty notifications");

  const next = freshBookings(first.known, [row("a", false), row("b", false), row("c", false)]);
  ok("  · a booking that appears afterwards is announced",
    next.fresh.map((b) => b.id).join() === "c", next.fresh.map((b) => b.id).join() || "nothing");

  const mine = freshBookings(next.known, [row("a", false), row("b", false), row("c", false), row("d", true)]);
  ok("  · your own is not news to you", mine.fresh.length === 0,
    mine.fresh.map((b) => b.id).join() || "nothing");

  const past = freshBookings(mine.known, [row("a", false), row("e", false, ended)]);
  ok("  · nor is one that has already finished", past.fresh.length === 0,
    "the listing reaches a day back; that is history, not an announcement");

  const again = freshBookings(past.known, [row("a", false), row("e", false, ended)]);
  ok("  · and nothing is announced twice", again.fresh.length === 0);
}

// ---- a footer built before the answer arrived ----------------------------------
//
// Everything else in the panel asks `canBook()` again every time it draws, so
// it corrects itself a moment later. The footer was built once, at the only
// moment the answer was still "guest", and stayed empty for the whole session:
// no way to subscribe a calendar, no way to connect one, and nothing anywhere
// saying why.
log("");
{
  const footOf = () => document.getElementById("cw-foot").textContent.trim();
  ok("a guest is offered nothing in the footer", footOf() === "", JSON.stringify(footOf()));

  role = "member";
  panel.roleChanged();
  await tick();
  ok("  · and the moment the role lands, the footer is there",
    footOf().includes("ปฏิทิน"), JSON.stringify(footOf()).slice(0, 80));
  ok("  · including the row that connects a Google Calendar",
    !!document.querySelector("#cw-foot .cal-gcal"),
    "an element for it, whether or not this server has Google configured");

  // And it does not rebuild itself out from under somebody mid-use.
  const was = document.querySelector("#cw-foot .cal-sub");
  panel.roleChanged();
  await tick();
  ok("  · asking again changes nothing", document.querySelector("#cw-foot .cal-sub") === was,
    "a footer rebuilt on every draw would wipe the feed address as it was read");
}

// ---- putting people on the meeting ---------------------------------------------
// Two fields, because picking a colleague out of a list this space already has
// and typing an outsider's address in full are different jobs. One array on the
// wire, because which of them is a member is not the browser's to decide.
log("");
{
  const fields = () => [...panel.form.querySelectorAll(".cal-chips")];
  const chipsIn = (f) => [...f.querySelectorAll(".cal-chip")].map((c) => c.firstChild.textContent);
  const typeInto = (f, text, key = "Enter") => {
    const input = f.querySelector("input");
    input.value = text;
    input.dispatchEvent(new KeyboardEvent("keydown", { key, bubbles: true, cancelable: true }));
  };

  // Open the form on an hour that will be accepted.
  refuseWith = null;
  hours[future].click();
  await tick();
  ok("the form has a field for colleagues and one for outsiders", fields().length === 2,
    `${fields().length} field(s)`);

  const [mates, guests] = fields();
  typeInto(mates, "somchai@company.test");
  typeInto(guests, "client@outside.test");
  await tick();
  ok("  · an address becomes a chip", chipsIn(mates).join() === "somchai@company.test",
    chipsIn(mates).join() || "nothing");

  typeInto(mates, "somchai@company.test");
  await tick();
  ok("  · the same one twice is still one", chipsIn(mates).length === 1, String(chipsIn(mates).length));

  // This probe has no say() of its own: the panel writes into its own message
  // line, which is the thing a person would actually read.
  const note = () => (document.querySelector(".cal-msg")?.textContent ?? "").trim();
  typeInto(mates, "not-an-address");
  await tick();
  ok("  · something that is not an address is refused, and said so",
    chipsIn(mates).length === 1 && note().includes("not-an-address"),
    JSON.stringify(note()) || "nothing said");

  // A list pasted out of a mail client arrives however that client felt like.
  typeInto(mates, "a@company.test, b@company.test");
  await tick();
  ok("  · a pasted list is split on commas and spaces", chipsIn(mates).length === 3,
    chipsIn(mates).join(" "));

  mates.querySelector(".cal-chip button").click();
  await tick();
  ok("  · and one of them can be taken off without retyping the others",
    chipsIn(mates).length === 2 && !chipsIn(mates).includes("somchai@company.test"),
    chipsIn(mates).join(" "));

  // ---- what actually goes out --------------------------------------------------
  posts.length = 0;
  titleIn().value = "ประชุมกับลูกค้า";
  submit().click();
  await tick(); await tick();
  const sent = posts[0]?.invitees ?? [];
  ok("both fields are sent as one list", sent.length === 3, JSON.stringify(sent));
  ok("  · with the outsider in it", sent.includes("client@outside.test"), JSON.stringify(sent));
  ok("  · as plain addresses, claiming nothing about who is a member",
    sent.every((x) => typeof x === "string"),
    "the server asks the membership table; anything the browser says is ignored");

  // ---- and the next booking starts empty ---------------------------------------
  hours[future].click();
  await tick();
  ok("a new booking does not inherit the last one's guests",
    fields().every((f) => chipsIn(f).length === 0),
    fields().map((f) => chipsIn(f).join(",")).join(" | ") || "empty");
  document.getElementById("cw-modal").click();
  await tick();
}

// ---- being told before it starts -------------------------------------------------
// A way of saying it, a number and a unit — three decisions, three controls.
// Minutes are what leaves: "2 hours" and "120 minutes" are one fact, and
// sending the word as well would be sending it twice.
log("");
{
  const rows = () => [...panel.form.querySelectorAll(".cal-remind-row")];
  const add = panel.form.querySelector(".cal-remind-add");

  refuseWith = null;
  hours[future].click();
  await tick();
  ok("a new booking asks for no reminders", rows().length === 0, String(rows().length));

  add.click();
  await tick();
  ok("  · one can be added", rows().length === 1, String(rows().length));
  const [how, unit] = rows()[0].querySelectorAll("select");
  const many = rows()[0].querySelector("input");
  ok("  · offering a notice in the app and an email",
    [...how.options].map((o) => o.value).join() === "popup,email",
    [...how.options].map((o) => o.value).join());
  ok("  · and minutes, hours, days and weeks",
    [...unit.options].map((o) => o.value).join() === "1,60,1440,10080",
    [...unit.options].map((o) => o.value).join());

  // Two hours, by email. The event matters: a person picking from the list
  // fires it, and the row shows its repeat controls in response — setting the
  // value alone is the probe reaching past the interaction it is testing.
  how.value = "email";
  how.dispatchEvent(new Event("change"));
  many.value = "2";
  unit.value = "60";
  unit.dispatchEvent(new Event("change"));

  add.click();
  await tick();
  const second = rows()[1];
  second.querySelector("input").value = "10";
  ok("  · and a second, which is a different reminder", rows().length === 2, String(rows().length));

  // The repeat, which only an email row is offered.
  const rep = rows()[0].querySelector(".cal-remind-rep");
  const often = rows()[0].querySelector(".cal-remind-times");
  ok("  · an email row is offered a repeat", !rep.hidden, `hidden=${rep.hidden}`);
  ok("    · with the same choices a calendar offers",
    [...rep.options].map((o) => o.value).join() === "none,daily,weekdays,weekly",
    [...rep.options].map((o) => o.value).join());
  ok("    · and how many times, only once it repeats", often.hidden, `hidden=${often.hidden}`);
  rep.value = "daily";
  rep.dispatchEvent(new Event("change"));
  often.value = "3";
  ok("      · which appears when it does", !often.hidden, `hidden=${often.hidden}`);

  // A notice in the app is never repeated: three days of it is three chances
  // to be looking somewhere else, not three reminders.
  ok("  · a notice in the app is offered none",
    rows()[1].querySelector(".cal-remind-rep").hidden, "popup rows carry no repeat");
  // Hidden with nothing in its place left the feature invisible to somebody
  // looking straight at the row it belongs to.
  ok("    · but is told why, rather than shown a gap",
    !rows()[1].querySelector(".cal-remind-why").hidden
    && rows()[1].querySelector(".cal-remind-why").textContent.includes("อีเมล"),
    rows()[1].querySelector(".cal-remind-why")?.textContent ?? "nothing there");
  ok("    · and an email row is not told it", rows()[0].querySelector(".cal-remind-why").hidden,
    "the controls are right there instead");

  posts.length = 0;
  titleIn().value = "ประชุมที่ต้องเตือน";
  submit().click();
  await tick(); await tick();
  const sent = posts[0]?.reminders ?? [];
  ok("both go out as minutes, whatever unit was on screen",
    JSON.stringify(sent) === JSON.stringify([
      { method: "email", minutes: 120, repeat: "daily", times: 3 },
      { method: "popup", minutes: 10, repeat: "none", times: 1 },
    ]), JSON.stringify(sent));

  // The ceiling is Google's: a reminder it refuses takes the event with it.
  hours[future].click();
  await tick();
  add.click();
  await tick();
  const u = rows()[0].querySelectorAll("select")[1];
  const n = rows()[0].querySelector("input");
  u.value = "10080";                       // weeks
  n.value = "9";
  u.dispatchEvent(new Event("change"));
  ok("nothing further ahead than four weeks can be asked for",
    Number(n.value) <= 4, `${n.value} week(s), max ${n.max}`);

  rows()[0].querySelector(".cal-remind-x").click();
  await tick();
  ok("  · and a row can be taken off again", rows().length === 0, String(rows().length));

  document.getElementById("cw-modal").click();
  await tick();
}

log(`\n${pass} passed, ${fail} failed\n`);
document.title = fail ? `FAIL ${fail}` : `PASS ${pass}`;
</script>
