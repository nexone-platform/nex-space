<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>แก้ไขแผนที่ — NexSpace</title>
  <style>
    /* The same tokens the app uses. Copied rather than imported because this is
       a separate entry point with its own bundle, and pulling in the app's
       stylesheet would pull in the app. */
    :root {
      --surface: #fff; --surface-2: #f7f8fa; --surface-3: #f2f3f6;
      --border: #e4e6eb; --border-2: #d7dae1;
      --text: #1b2027; --text-2: #3d434c; --text-3: #545a63;
      --muted: #6b7079; --faint: #9aa0a8;
      --accent: #10786e; --accent-hover: #0c635b; --accent-soft: #d7ecea;
      --teal: #2bb3a3; --danger: #c0392b; --warn: #8a5905;
      --sans: "IBM Plex Sans Thai", "Noto Sans Thai", "Leelawadee UI", "Segoe UI", system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --surface: #1e1f26; --surface-2: #24262e; --surface-3: #2b2d36;
        --border: #343741; --border-2: #414552;
        --text: #e6eaef; --text-2: #c3c9d2; --text-3: #a9b0ba;
        --muted: #9aa2ad; --faint: #7b8390;
        --accent: #3fb3a5; --accent-hover: #4fd0be; --accent-soft: #1b3a37;
        --danger: #e5776f; --warn: #f0b429;
      }
    }
    /* an explicit choice in the app beats the operating system's */
    :root[data-theme="dark"] {
      --surface: #1e1f26; --surface-2: #24262e; --surface-3: #2b2d36;
      --border: #343741; --border-2: #414552;
      --text: #e6eaef; --text-2: #c3c9d2; --text-3: #a9b0ba;
      --muted: #9aa2ad; --faint: #7b8390;
      --accent: #3fb3a5; --accent-hover: #4fd0be; --accent-soft: #1b3a37;
      --danger: #e5776f; --warn: #f0b429;
    }


    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--surface-2); color: var(--text);
      font: 14px var(--sans); -webkit-font-smoothing: antialiased;
      display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100dvh;
    }

    /* ---- top bar ---- */
    .top {
      display: flex; align-items: center; gap: 12px; padding: 10px 14px;
      background: var(--surface); border-bottom: 1px solid var(--border);
    }
    .brand { font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
    .brand small { display: block; font-weight: 400; font-size: 11.5px; color: var(--muted); }
    .top .sp { flex: 1; }
    input[type="text"], input[type="number"], select {
      font: inherit; color: var(--text); background: var(--surface-3);
      border: 1px solid transparent; border-radius: 9px; padding: 7px 10px; outline: none;
    }
    input:focus, select:focus { background: var(--surface); border-color: var(--accent); }
    #map-name { width: 170px; }

    /* the maps of this space, along the top bar where a document's tabs go */
    .maps { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .maps button {
      border-radius: 20px; padding: 6px 12px; font-size: 12.5px;
      background: var(--surface-3); border-color: transparent; color: var(--text-3);
      max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .maps button[aria-current="true"] {
      background: var(--accent-soft); border-color: var(--accent); color: var(--accent);
    }
    .maps button.add { color: var(--accent); background: transparent; border-style: dashed; border-color: var(--border-2); }
    /* What can be done TO the floor you are on, kept apart from the tabs by a
       hairline so "move this one" is not mistaken for "go to that one". */
    .maps .tools { display: flex; gap: 3px; padding-left: 7px; margin-left: 3px; border-left: 1px solid var(--border); }
    .maps .tools button { padding: 6px 9px; background: transparent; border-color: transparent; }
    .maps .tools button:hover:not(:disabled) { background: var(--surface-3); }
    .maps .tools button.danger { color: var(--danger); }
    .maps .tools button:disabled { opacity: .35; cursor: default; }
    .maps .landing { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
    button {
      font: 600 13px var(--sans); cursor: pointer; border-radius: 9px;
      border: 1px solid var(--border-2); background: var(--surface); color: var(--text-2);
      padding: 8px 12px; transition: background .12s, border-color .12s, color .12s;
    }
    button:hover:not(:disabled) { background: var(--surface-3); }
    button:disabled { opacity: .45; cursor: default; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
    button.danger { color: var(--danger); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .icon-btn { padding: 8px 10px; }

    /* ---- three columns ---- */
    .body { display: grid; grid-template-columns: 232px minmax(0, 1fr) 244px; min-height: 0; }
    .rail, .side {
      background: var(--surface); overflow-y: auto; padding: 12px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .rail { border-right: 1px solid var(--border); }
    .side { border-left: 1px solid var(--border); }
    .grp { display: flex; flex-direction: column; gap: 7px; }
    .grp > h3 {
      margin: 0; font-size: 11px; font-weight: 700; letter-spacing: .07em;
      text-transform: uppercase; color: var(--faint);
    }

    /* tools */
    .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .tool {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 9px 4px; font-size: 12px; font-weight: 600;
      border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2);
      color: var(--text-2);
    }
    .tool span.k { font-size: 17px; line-height: 1; }
    .tool[aria-pressed="true"] {
      background: var(--accent-soft); border-color: var(--accent); color: var(--accent);
    }

    /* floor swatches */
    .swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
    .sw {
      padding: 0; width: 100%; aspect-ratio: 1; border-radius: 8px; overflow: hidden;
      border: 2px solid var(--border); background: var(--surface-3);
      display: grid; place-items: center;
    }
    .sw canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
    .sw[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }

    /* prop palette */
    .props { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
    .prop {
      padding: 3px; aspect-ratio: 1; border-radius: 8px;
      border: 2px solid var(--border); background: var(--surface-3);
      display: grid; place-items: center; overflow: hidden;
    }
    .prop img { max-width: 100%; max-height: 100%; image-rendering: pixelated; }
    .prop[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
    .row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-3); }
    .row label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .row input[type="number"] { width: 64px; }
    .hint { font-size: 11.5px; line-height: 1.55; color: var(--muted); margin: 0; }

    /* ---- the map ---- */
    .stage { overflow: auto; padding: 18px; background: var(--surface-2); }
    #map-wrap { display: inline-block; line-height: 0; box-shadow: 0 2px 8px #0000001f, 0 14px 40px #00000014; }
    #map { image-rendering: pixelated; display: block; cursor: crosshair; touch-action: none; }

    /* ---- lists on the right ---- */
    .item {
      display: flex; align-items: center; gap: 8px; padding: 7px 9px;
      border-radius: 9px; background: var(--surface-2); font-size: 12.5px;
    }
    .item b { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item button { padding: 3px 7px; font-size: 11px; border-radius: 7px; }
    .item.meet { outline: 1px solid var(--accent); }
    .empty { font-size: 12px; color: var(--faint); padding: 2px; }

    /* ---- status ---- */
    .status {
      display: flex; align-items: center; gap: 14px; padding: 7px 14px;
      background: var(--surface); border-top: 1px solid var(--border);
      font-size: 12.5px; color: var(--muted); min-height: 34px;
    }
    .status .sp { flex: 1; }
    .status b { color: var(--text-2); font-weight: 600; font-variant-numeric: tabular-nums; }
    .bad { color: var(--danger); font-weight: 600; }
    .good { color: var(--accent); font-weight: 600; }

    /* ---- the sign-in / no-workspace wall ---- */
    .wall {
      position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
      background: var(--surface-2); padding: 24px;
    }
    .wall[hidden] { display: none; }
    .wall .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 26px 28px; max-width: 420px; box-shadow: 0 12px 36px #00000014;
    }
    .wall h2 { margin: 0 0 8px; font-size: 18px; }
    .wall p { margin: 0 0 14px; color: var(--muted); line-height: 1.6; font-size: 13.5px; }
    .wall a { color: var(--accent); }

    @media (max-width: 1000px) {
      .body { grid-template-columns: 200px minmax(0, 1fr); }
      .side { display: none; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">NexSpace<small id="which">แก้ไขแผนที่</small></div>
    <div class="maps" id="map-tabs"></div>
    <input id="map-name" type="text" placeholder="ชื่อแผนที่" maxlength="60" />
    <button id="btn-undo" class="icon-btn" title="เลิกทำ (Ctrl+Z)">↶</button>
    <button id="btn-redo" class="icon-btn" title="ทำซ้ำ (Ctrl+Shift+Z)">↷</button>
    <span class="sp"></span>
    <button id="btn-revert" class="danger">คืนค่าแผนที่สำเร็จรูป</button>
    <button id="btn-save" class="primary">บันทึก</button>
  </header>

  <div class="body">
    <aside class="rail">
      <div class="grp">
        <h3>เครื่องมือ</h3>
        <div class="tools" id="tools"></div>
      </div>
      <div class="grp" id="opts"></div>
      <div class="grp">
        <h3>ขนาดแผนที่</h3>
        <div class="row">
          <label>กว้าง <input id="in-cols" type="number" min="4" max="200" /></label>
          <label>สูง <input id="in-rows" type="number" min="4" max="200" /></label>
        </div>
        <p class="hint">ย่อแผนที่แล้วของที่อยู่นอกขอบใหม่จะถูกลบ</p>
      </div>
      <div class="grp">
        <h3>มุมมอง</h3>
        <div class="row">
          <label><input id="ck-grid" type="checkbox" checked /> เส้นตาราง</label>
          <label><input id="ck-marks" type="checkbox" checked /> หมุด</label>
        </div>
        <div class="row">
          <label>ซูม <select id="in-zoom">
            <option value="1">100%</option>
            <option value="1.5">150%</option>
            <option value="2" selected>200%</option>
            <option value="3">300%</option>
          </select></label>
        </div>
      </div>
    </aside>

    <main class="stage">
      <div id="map-wrap"><canvas id="map" width="320" height="320"></canvas></div>
    </main>

    <aside class="side">
      <div class="grp">
        <h3>โซนส่วนตัว</h3>
        <div id="area-list"></div>
        <p class="hint">ยืนในโซนเดียวกันคือได้ยินกันหมด และคนนอกไม่ได้ยินเลย · โซนที่มีขอบเน้นคือห้องประชุม</p>
      </div>
      <div class="grp">
        <h3>โต๊ะ</h3>
        <div id="desk-list"></div>
      </div>
      <div class="grp">
        <h3>วัตถุโต้ตอบ</h3>
        <div id="obj-list"></div>
      </div>
    </aside>
  </div>

  <footer class="status">
    <span id="st-tile">—</span>
    <span id="st-what"></span>
    <span class="sp"></span>
    <span id="st-problem"></span>
    <span id="st-saved"></span>
  </footer>

  <div class="wall" id="wall" hidden>
    <div class="card">
      <h2 id="wall-title">ต้องเข้าสู่ระบบก่อน</h2>
      <p id="wall-body"></p>
      <a id="wall-link" href="/">← กลับไปที่ NexSpace</a>
    </div>
  </div>

  <script type="module" src="/src/editor/main.ts"></script>
</body>
</html>
