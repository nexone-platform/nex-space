# This server sits behind another proxy that terminates TLS, so $scheme here is
# always "http". Google's redirect URI is built from these headers, so forward
# what the outer proxy said the client used and only fall back to $scheme.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
map $http_x_forwarded_host $fwd_host {
    default $http_x_forwarded_host;
    ""      $http_host;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # An upload is the body of one request. nginx defaults to 1m, which would
    # refuse most screenshots before the API ever saw them — and refuse them
    # with its own HTML error page, which the client cannot read.
    client_max_body_size 12m;

    # Frontend Single Page Application routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy WebSocket & Colyseus Game Server Requests
    location /colyseus/ {
        proxy_pass http://nexspace-game:2567/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $fwd_host;
    }

    # The media server's signalling socket.
    #
    # Signalling is the only part of an SFU a proxy can carry — the media itself
    # is UDP straight to the machine on 7882, which is why that port has to be
    # open and why nothing here can stand in for it.
    #
    # The upstream is a VARIABLE, and that is the whole point of this block.
    # nginx resolves a literal proxy_pass host when it READS the config and
    # refuses to start if the name does not exist. The media server sits behind
    # a compose profile, so on a deployment where it is switched off the name
    # does not exist — and naming it directly took the entire site down: nginx
    # exited on "host not found in upstream", the web container restarted
    # forever, and the app, the API proxy and everything else went with it. An
    # optional dependency has no business being able to do that.
    #
    # With a variable the lookup happens per request against docker's own DNS,
    # so an absent media server costs the media server and nothing else. It also
    # means the URI is passed through untouched, so the prefix comes off here
    # rather than in proxy_pass: LIVEKIT_URL is wss://<host>/lk and the client
    # asks for <url>/rtc/v1, which has to arrive as /rtc/v1.
    location /lk/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $livekit http://nexspace-livekit:7880;
        rewrite ^/lk/(.*)$ /$1 break;
        proxy_pass $livekit;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $fwd_host;
        # held open for as long as somebody is in the room
        proxy_read_timeout 12h;
        proxy_send_timeout 12h;
    }

    # Proxy LiveKit / Game Server HTTP endpoints
    location /livekit/ {
        proxy_pass http://nexspace-game:2567/livekit/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $fwd_host;
    }

    # Proxy API requests to backend API server
    location /auth/ {
        proxy_pass http://nexspace-api:3001/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $fwd_host;
    }

    # Workspace list / create / join / settings / access checks
    location /workspaces {
        proxy_pass http://nexspace-api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $fwd_host;
    }

    # Proxy current-user endpoints (session resume + avatar save): /me, /me/avatar
    location /me {
        proxy_pass http://nexspace-api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $fwd_host;
    }

    # A visitor's guest-pass link (?g=<code>) asks here for the name on the pass.
    # Unauthenticated by design — the code in their URL is the credential — but it
    # still needs its own block: without one it falls through to the SPA above and
    # answers index.html with a 200, which the client cannot parse.
    location /guest-pass/ {
        proxy_pass http://nexspace-api:3001/guest-pass/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $fwd_host;
    }

    # Relay credentials for the call. Its own block because it is an exact path:
    # without one it falls through to the SPA and answers index.html with a 200,
    # which the client cannot read and would silently treat as "no relay".
    location = /ice {
        proxy_pass http://nexspace-api:3001/ice;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $fwd_host;
    }

    # so an uptime check can reach the API through the same host as the app
    location = /health {
        proxy_pass http://nexspace-api:3001/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $fwd_host;
    }

    # Files in the chat. The link carries its own signature and expiry, so this
    # needs no auth of its own — but it does need its own block, or an <img> src
    # falls through to the SPA and gets index.html with a 200.
    location /uploads/ {
        proxy_pass http://nexspace-api:3001/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $fwd_host;
    }

    # Reading and spending an emailed invitation. Its own block because the link
    # in the email lands here before anybody has signed in: without one it falls
    # through to the SPA and answers index.html with a 200, which the client
    # cannot parse and would report as "that invitation does not exist".
    location /invites/ {
        proxy_pass http://nexspace-api:3001/invites/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $fwd_host;
    }

    location /maps/ {
        proxy_pass http://nexspace-api:3001/maps/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $fwd_host;
    }
}
