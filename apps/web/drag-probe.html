<title>drag probe</title>
<!--
  The two floating panels, moved the way a pointer moves them.

  Open http://localhost:5173/drag-probe.html with the web dev server running.
  It builds the same markup index.html has, applies the real helper, and drives
  it with synthetic pointer events — so it checks the behaviour, not a guess
  about the behaviour.
-->
<style>
  #convo { position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; pointer-events: none; }
  #convo-tiles { padding: 6px; background: #14121a; pointer-events: auto; width: 300px; height: 120px; }
  #meet-panel { position: fixed; top: 14px; left: 50%; transform: translate(-50%, 0);
    width: 240px; height: 100px; background: #23242a; }
  #out { font: 13px/1.6 ui-monospace, monospace; padding: 16px; white-space: pre-wrap; margin-top: 260px; }
</style>
<div id="convo"><div id="convo-tiles">tiles</div></div>
<div id="meet-panel"><button id="inside">a button inside</button></div>
<pre id="out"></pre>
<script type="module">
import { makeDraggable } from "/src/dragPanel.ts";

const out = document.getElementById("out");
const log = (s) => { out.textContent += s + "\n"; };
let pass = 0, fail = 0;
const ok = (n, c, x = "") => { c ? pass++ : fail++; log(`${c ? "  PASS" : "! FAIL"}  ${n}${x ? "  " + x : ""}`); };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

const send = (el, type, x, y) => el.dispatchEvent(new PointerEvent(type, {
  pointerId: 1, clientX: x, clientY: y, button: 0, buttons: type === "pointerup" ? 0 : 1,
  bubbles: true, cancelable: true,
}));
async function drag(handle, from, to) {
  send(handle, "pointerdown", from[0], from[1]);
  await wait(20);
  send(handle, "pointermove", to[0], to[1]);
  await wait(20);
  send(handle, "pointerup", to[0], to[1]);
  await wait(20);
}
const at = (el) => { const b = el.getBoundingClientRect(); return [Math.round(b.left), Math.round(b.top)]; };

localStorage.removeItem("nexspace-panel-convo");
localStorage.removeItem("nexspace-panel-meet");

const convo = document.getElementById("convo");
const grip = document.getElementById("convo-tiles");
const meet = document.getElementById("meet-panel");
makeDraggable(convo, grip, "convo");
makeDraggable(meet, meet, "meet");

(async () => {
  log("moving the panels that float over the map\n");

  // Small enough to land inside the viewport whatever its size — being thrown
  // at the edge is the next assertion's job, not this one's.
  const start = at(convo);
  await drag(grip, [start[0] + 40, start[1] + 20], [start[0] + 70, start[1] + 60]);
  const moved = at(convo);
  ok("the conversation panel follows the pointer",
    moved[0] === start[0] + 30 && moved[1] === start[1] + 40, `${start} → ${moved}`);
  ok("  · and the centring transform is gone, so it stays put",
    convo.style.transform === "none", convo.style.transform);
  ok("  · remembered for next time",
    !!localStorage.getItem("nexspace-panel-convo"), localStorage.getItem("nexspace-panel-convo"));

  // Off the bottom-right corner, far past the edge.
  await drag(grip, at(convo).map((v, i) => v + 10), [window.innerWidth + 800, window.innerHeight + 800]);
  const box = convo.getBoundingClientRect();
  ok("it cannot be thrown off the screen",
    box.right <= window.innerWidth + 1 && box.bottom <= window.innerHeight + 1,
    `right ${Math.round(box.right)}/${window.innerWidth}, bottom ${Math.round(box.bottom)}/${window.innerHeight}`);

  // Double click puts it home.
  grip.dispatchEvent(new MouseEvent("dblclick", { bubbles: true }));
  await wait(20);
  ok("double click gives it back", convo.style.left === "" && convo.style.transform === "");
  ok("  · and stops remembering", !localStorage.getItem("nexspace-panel-convo"));

  // A button inside must still be a button, and a drag ending on it must not press it.
  let presses = 0;
  document.getElementById("inside").addEventListener("click", () => presses++);
  const mStart = at(meet);
  await drag(meet, [mStart[0] + 5, mStart[1] + 5], [mStart[0] + 5, mStart[1] + 5]);   // a click, not a drag
  ok("the meeting panel does not move for a click", at(meet)[0] === mStart[0], `${mStart} → ${at(meet)}`);

  const btn = document.getElementById("inside");
  send(btn, "pointerdown", 0, 0);
  await wait(20);
  send(btn, "pointerup", 0, 0);
  btn.click();
  await wait(20);
  ok("a button inside still presses", presses === 1, `${presses} press(es)`);

  await drag(meet, [at(meet)[0] + 5, at(meet)[1] + 5], [at(meet)[0] + 205, at(meet)[1] + 105]);
  btn.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true }));
  await wait(20);
  ok("  · but a drag that ends on it does not press it", presses === 1, `${presses} press(es)`);

  log(`\n${pass} passed, ${fail} failed\n`);
  document.title = fail ? `FAIL ${fail}` : `PASS ${pass}`;
})().catch((e) => { log("BROKE: " + (e?.stack || e)); document.title = "BROKE"; });
</script>
